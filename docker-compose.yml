version: '3.8'

services:
  microservicio:
    build:
      context: .
      dockerfile: Dockerfile
    image: fpalaciosm-hub/doy0101-evaluacion2-microservicio:latest
    container_name: devops_microservicio_app
    ports:
      - "5000:5000"
    environment:
      - ENV=production
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always
