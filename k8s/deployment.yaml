apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservicio-python
  namespace: default
  labels:
    app: microservicio-python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservicio-python
  template:
    metadata:
      labels:
        app: microservicio-python
      annotations:
        # Estas anotaciones le indican a Prometheus que autodescubra el pod y lea la ruta /metrics
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"
    spec:
      containers:
      - name: microservicio-python
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}://
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
